# steps:
#   - ...
#   - uses: docker-library/bashbrew
#   - ...

name: 'Install Bashbrew'
description: 'Install the "bashbrew" tool in GITHUB_PATH'
runs:
  using: 'composite'
  steps:

    - run: |
        # TODO this actually cannot work at all...  GitHub does not clone actions - they just download them, so there's no ".git" and the "github" context (as of 2023-12-01) does not even include which commit something like "HEAD" was resolved to, so the best we could do is use "github.action_ref" (stored in an environment variable because reasons 🙃) and re-clone it ourselves, hope it's close enough to what it's supposed to be, and then key off *that* instead
        #   see also https://docs.github.com/en/actions/learn-github-actions/contexts#github-context and https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#runs-for-composite-actions
        exit 1
        # let's first check if there are any actual meaningful changes to our Go files since the latest release (because if there aren't, we can just download the latest release instead of building from source, which should be quite a bit faster)
        git -C '${{ github.action_path }}' fetch --unshallow --tags https://github.com/docker-library/bashbrew.git
        latestGoCommit="$(git -C '${{ github.action_path }}' log -1 --format=format:%H -- ':!cmd/bashbrew/version.go' '**.go' 'go.**')"
        latestRelease="$(git -C '${{ github.action_path }}' tag --sort=version:refname --contains "$latestGoCommit" | tail -1)"
        if [ -n "$latestRelease" ]; then
          arch="$('${{ github.action_path }}/scripts/bashbrew-host-arch.sh')"
          ext=
          case "$arch" in
            windows-*) ext='.exe' ;;
          esac
          mkdir -p '${{ github.action_path }}/bin'
          curl -fL -o '${{ github.action_path }}/bin/bashbrew'"$ext" "https://github.com/docker-library/bashbrew/releases/download/$latestRelease/bashbrew-$arch$ext"
          chmod +x '${{ github.action_path }}/bin/bashbrew'"$ext"
          '${{ github.action_path }}/bin/bashbrew' --version
          echo 'bashbrew-needs-build=false' >> "$GITHUB_OUTPUT"
        else
          echo 'bashbrew-needs-build=true' >> "$GITHUB_OUTPUT"
        fi
      id: download-release
      shell: 'bash -Eeuo pipefail -x {0}'

    - uses: actions/setup-go@v3
      with:
        go-version-file: '${{ github.action_path }}/go.mod'
      if: ${{ steps.download-release.outputs.bashbrew-needs-build }}

    - run: |
        if [ '${{ steps.download-release.outputs.bashbrew-needs-build }}' = 'true' ]; then
          '${{ github.action_path }}/bashbrew.sh' --version > /dev/null
        fi
        '${{ github.action_path }}/bin/bashbrew' --version
        echo '${{ github.action_path }}/bin' >> "$GITHUB_PATH"
        echo 'BASHBREW_SCRIPTS=${{ github.action_path }}/scripts' >> "$GITHUB_ENV"
      shell: 'bash -Eeuo pipefail -x {0}'
